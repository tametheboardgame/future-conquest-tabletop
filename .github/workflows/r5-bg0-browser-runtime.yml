name: R5 BG0 browser runtime gate

on:
  pull_request:
    branches: [main, r5/bg0-hardware-safe-board-hotfix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-launch-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Run R5 test suite explicitly
        run: npm run test:r5
      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Verify diff whitespace
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }} ${{ github.event.pull_request.head.sha || 'HEAD' }}
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact production build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/future-conquest-vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/future-conquest-vite.log
          exit 1
      - name: Exercise R5 campaign launch in Chromium
        id: browser_gate
        run: node scripts/probe-r5-bg0-runtime.mjs
      - name: Isolate custom-layer settlement paths
        if: failure() && steps.browser_gate.outcome == 'failure'
        run: |
          for mode in none world formations full; do
            R5_DIAGNOSTIC_ONLY=1 R5_DIAGNOSTIC_SCENE_MODE="$mode" node scripts/probe-r5-bg0-runtime.mjs
          done
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-bg0-browser-runtime
          path: |
            /tmp/r5-bg0-runtime.png
            /tmp/future-conquest-vite.log
          if-no-files-found: warn
